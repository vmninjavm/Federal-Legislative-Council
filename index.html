<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المجلس التشريعي الفيدرالي - النظام التشريعي المتكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0B132B;
  --bg2:#111827;
  --cd:#1E293B;
  --ln:#3b4a63;
  --tx:#f3efe2;
  --mu:#98a3b8;
  --gd:#B39455;
  --r:#c0504a;
  --o:#d28440;
  --y:#cdae45;
  --g:#4da15f
}

*,*:before,*:after {
  box-sizing:inherit
}

html,body {
  margin:0
}

body {
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  background-color:var(--bg);
  color:var(--tx);
  font-family:Tajawal,Tahoma,sans-serif;
  line-height:1.6;
  min-height:100vh
}

h1,h2,h3 {
  font-family:Amiri,'Times New Roman',serif;
  margin:0
}

svg.i {
  width:1.2em;
  height:1.2em;
  fill:none;
  stroke:currentColor;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  vertical-align:middle
}

.mu {
  color:var(--mu);
  font-size:.85rem
}

.cd {
  background:var(--cd);
  border:1px solid var(--ln);
  border-top:2px solid var(--gd);
  border-radius:6px;
  box-shadow:0 4px 16px rgba(4,9,24,.28)
}

.hd {
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--gd)
}

.hd img.seal {
  width:80px;
  height:80px;
  flex:0 0 auto
}

.hd h1 {
  font-size:1.55rem;
  color:var(--gd);
  line-height:1.3
}

.hd .sp {
  flex:1
}

.b {
  font:inherit;
  font-weight:700;
  font-size:.92rem;
  cursor:pointer;
  border:1px solid #4d6080;
  background:#24334d;
  color:var(--tx);
  border-radius:6px;
  padding:8px 16px;
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  line-height:1.3;
  transition:background-color .16s ease,border-color .16s ease,transform .12s ease
}

.b:hover:not(:disabled) {
  background:#2d4061;
  border-color:#6980a6
}

.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible {
  outline:2px solid var(--gd);
  outline-offset:2px
}

.b.sm {
  min-height:32px;
  padding:4px 11px;
  font-size:.82rem
}

.b.gd {
  background:var(--gd);
  color:#0B132B;
  border-color:var(--gd)
}

.b.gd:hover:not(:disabled) {
  background:#c7a663;
  border-color:#c7a663
}

.b.ok {
  background:rgba(77,161,95,.12);
  border-color:var(--g);
  color:#8fd69f
}

.b.ok:hover:not(:disabled) {
  background:rgba(77,161,95,.22)
}

.b.no {
  background:rgba(192,80,74,.12);
  border-color:var(--r);
  color:#f29b95
}

.b.no:hover:not(:disabled) {
  background:rgba(192,80,74,.24)
}

nav {
  max-width:1200px;
  margin:10px auto 0;
  padding:0 20px 10px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--ln)
}

.nt {
  display:flex;
  flex:1 1 auto;
  min-width:0;
  gap:4px;
  flex-wrap:nowrap;
  overflow-x:auto;
  scrollbar-width:thin
}

.nt button {
  font:inherit;
  font-weight:500;
  white-space:nowrap;
  color:var(--mu);
  background:none;
  border:0;
  border-bottom:3px solid transparent;
  padding:9px 12px;
  cursor:pointer;
  transition:color .15s ease,border-color .15s ease
}

.nt button:hover { color:var(--tx) }

.nt button.on {
  color:var(--gd);
  border-color:var(--gd);
  font-weight:700
}

.mn { position:relative; flex:0 0 auto }

.mnb {
  font:inherit;
  font-weight:700;
  color:var(--gd);
  background:#1b2a47;
  border:1px solid var(--gd);
  border-radius:6px;
  padding:7px 16px;
  min-height:40px;
  cursor:pointer
}

.mnb[aria-expanded="true"] { background:#24324b }

.mnl {
  position:absolute;
  inset-inline-start:0;
  top:calc(100% + 6px);
  z-index:30;
  min-width:310px;
  display:flex;
  flex-direction:column;
  padding:6px;
  background:var(--cd);
  border:1px solid var(--gd);
  border-radius:3px;
  box-shadow:0 10px 28px rgba(0,0,0,.55)
}

.mnl[hidden] { display:none }

.mnl button {
  display:flex;
  align-items:center;
  gap:10px;
  text-align:start;
  font:inherit;
  color:var(--tx);
  background:none;
  border:0;
  border-inline-start:3px solid transparent;
  padding:9px 12px;
  cursor:pointer
}

.mnl button:hover { background:#1b2a47 }

.mnl button.on {
  background:#24324b;
  border-inline-start-color:var(--gd);
  color:var(--gd);
  font-weight:700
}

.mnl .mni {
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid currentColor;
  border-radius:50%;
  font-size:.74rem;
  flex:0 0 auto
}

.mnl i {
  margin-inline-start:auto;
  font-size:.72rem;
  font-style:normal;
  color:var(--mu)
}

.mnc { display:none; color:var(--gd); font-weight:700 }

main {
  max-width:1200px;
  margin:auto;
  padding:16px 20px 50px
}

.bar {
  height:9px;
  background:#0d1730;
  border:1px solid var(--ln);
  border-radius:1px;
  position:relative;
  overflow:hidden
}

.bar i {
  display:block;
  height:100%
}

.bar:after {
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(11,19,43,.7) 9.5% 10%)
}

.ov {
  display:flex;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
  padding:16px 20px;
  margin-bottom:14px
}

.ov .big {
  font-family:Amiri,serif;
  font-size:3rem;
  line-height:1;
  font-variant-numeric:tabular-nums
}

.ov .bar {
  flex:1 1 220px;
  height:16px
}

.tiles {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
  gap:10px;
  margin-bottom:18px
}

.tile {
  font:inherit;
  color:var(--tx);
  text-align:start;
  padding:12px 13px;
  cursor:pointer;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:4px 10px;
  align-items:center;
  transition:border-color .15s ease,background-color .15s ease
}

.tile:hover {
  background:#24334d;
  border-color:#5b7196
}

.tile .bar {
  grid-column:1/-1
}

.tile small {
  color:var(--gd);
  display:block
}

.tile b {
  font-size:.88rem;
  line-height:1.35;
  font-weight:500
}

.tile.on {
  outline:1px solid var(--gd);
  background:#24324b
}

.tile-exp {
  grid-column:1/-1;
  margin-top:4px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:30px;
  padding:4px 10px;
  font-size:.78rem;
  font-family:inherit;
  color:var(--gd);
  background:rgba(179,148,85,.08);
  border:1px solid rgba(179,148,85,.35);
  border-radius:4px;
  cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease;
}

.tile-exp:hover {
  background:rgba(179,148,85,.18);
  border-color:var(--gd);
}

.tile-exp svg {
  width:14px;
  height:14px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto;
}

.sh {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:6px 0 10px;
  color:var(--gd);
  font-size:1.35rem
}

.tr {
  display:grid;
  grid-template-columns:72px 1.5fr 1.1fr 1.6fr 52px;
  gap:10px;
  align-items:center;
  padding:9px 14px;
  border-bottom:1px solid #2b3951;
  cursor:pointer
}

.tr:hover {
  background:#24324b
}

.tr.h {
  cursor:default;
  color:var(--mu);
  font-size:.8rem
}

.tr.h:hover {
  background:none
}

.pc {
  display:flex;
  gap:10px;
  align-items:center
}

.pc .bar {
  flex:1
}

.pc b {
  width:38px;
  text-align:end
}

.up {
  color:#7fcf92
}

.dn {
  color:#ee8c86
}

.ref {
  color:var(--gd);
  font-size:.8rem;
  direction:ltr;
  text-align:end
}

@media(max-width:700px) {
  .tr {
    grid-template-columns:1.6fr 1fr 1.2fr;
    font-size:.88rem
  }
  .tr>:first-child,.tr>:last-child {
    display:none
  }
  .ov {
    flex-wrap:wrap
  }
  .pb {
    grid-template-columns:1fr!important
  }
}

.bill {
  padding:16px 20px;
  margin-bottom:16px
}

.bh {
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:6px
}

.bh h3 {
  font-size:1.3rem;
  flex:1 1 220px
}

.st {
  font-size:.8rem;
  padding:3px 10px;
  border-radius:4px;
  border:1px solid currentColor
}

.pb {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:8px 0
}

.pb p {
  margin:2px 0 6px
}

.chip {
  display:inline-block;
  border:1px solid currentColor;
  border-radius:4px;
  padding:1px 9px;
  margin:2px 3px;
  font-size:.8rem
}

.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:10px 0;
  align-items:center
}

.row>* {
  flex:1 1 140px
}

input,select,textarea {
  font:inherit;
  color:var(--tx);
  background:#0d1730;
  border:1px solid #485b7a;
  border-radius:6px;
  padding:8px 12px;
  min-height:40px;
  transition:border-color .15s ease
}

input:hover,select:hover,textarea:hover {
  border-color:#6980a6
}

input[type="checkbox"],input[type="radio"] {
  min-height:auto;
  padding:0
}

textarea {
  width:100%;
  min-height:94px
}

.bx {
  padding:16px 20px;
  margin-bottom:16px
}

.bx h3 {
  color:var(--gd);
  margin-bottom:8px
}

dialog {
  background:var(--cd);
  color:var(--tx);
  border:1px solid var(--gd);
  border-radius:8px;
  max-width:92vw;
  width:520px;
  padding:20px 24px
}

dialog::backdrop {
  background:rgba(0,0,0,.7)
}

#ts {
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%);
  background:var(--gd);
  color:#0B132B;
  font-weight:700;
  padding:9px 20px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
  z-index:9
}

#ts.on {
  opacity:1
}

#pvl {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px
}

#pvl img {
  width:100%;
  border:1px solid var(--ln)
}

#rx {
  position:fixed;
  left:-10000px;
  top:0
}

.pg {
  width:1000px;
  min-height:1340px;
  padding:34px 40px;
  background:#0B132B;
  color:#f3efe2;
  font-family:Tajawal,Tahoma,sans-serif;
  direction:rtl;
  border:8px double #B39455;
  position:relative
}

.pg .ph {
  display:flex;
  align-items:center;
  gap:18px;
  border-bottom:2px solid #B39455;
  padding-bottom:14px;
  margin-bottom:16px
}

.pg .ph h1 {
  color:#B39455;
  font-size:1.9rem;
  line-height:1.3
}

.pg .ph .seal {
  width:92px;
  height:92px
}

.pg .ph.m .seal {
  width:56px;
  height:56px
}

.pg .ph.m h1 {
  font-size:1.3rem
}

.pg .sec {
  margin-bottom:16px;
  background:#1E293B;
  border:1px solid #3b4a63;
  border-top:2px solid #B39455
}

.pg .sh {
  padding:8px 14px;
  margin:0;
  font-size:1.15rem
}

.pg .tr {
  cursor:default;
  padding:6px 14px;
  font-size:.88rem
}

.pg .ft {
  position:absolute;
  bottom:18px;
  left:40px;
  right:40px;
  display:flex;
  justify-content:space-between;
  color:#98a3b8;
  font-size:.78rem;
  border-top:1px solid #3b4a63;
  padding-top:6px
}

.pg .sm {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 20px;
  margin-bottom:16px
}

.pg .sm div {
  display:flex;
  gap:10px;
  align-items:center;
  font-size:.88rem
}

.pg .sm span {
  flex:1
}

.pg .dc {
  background:#1E293B;
  border-inline-start:4px solid #B39455;
  padding:7px 14px;
  margin-bottom:6px;
  font-size:.88rem
}


/* ---- additions ---- */
.sbw { max-width: 1200px; margin: 8px auto 0; padding: 0 20px; }
.sb { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; padding: 10px 14px; }
.sb label { display: flex; flex-direction: column; font-size: .8rem; color: var(--mu); gap: 2px; }
.sb input, .sb select { padding: 5px 8px; }
.sbt { color: var(--gd); font-family: Amiri, serif; font-size: 1.15rem; }
.st.gdc { color: var(--gd); }
.b.pr {
  background: var(--gd);
  color: #0B132B;
  border-color: var(--gd);
  font-size: 1rem;
  padding: 10px 20px;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--gd);
}
.stamp {
  border: 5px double;
  padding: 8px 22px;
  transform: rotate(-6deg);
  font-family: Amiri, serif;
  font-size: 2rem;
  text-align: center;
  line-height: 1.3;
}
.sc { padding: 10px 14px; border-inline-start: 3px solid var(--ln); margin: 4px 0; }
.b.later { border-color: var(--gd); color: var(--gd); }
.b:disabled { opacity: .5; cursor: wait; }
.busy { color: var(--gd); font-weight: 700; text-align: center; position: sticky; top: 6px; z-index: 5; }
.done { text-align: center; padding: 34px 20px; margin: 24px 0; border: 3px double var(--gd); }
.done h2 { color: var(--gd); font-size: 1.8rem; line-height: 1.5; }
.done .b { margin-top: 8px; }
.fld { display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--mu); }
.fld input, .fld select { font-size: 1rem; width: 100%; }
.days { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0; }
.bx h4 { margin: 12px 0 4px; }
.bx h4.gdc { color: var(--gd); }
details { border-top: 1px solid var(--ln); padding: 8px 0; }
summary { cursor: pointer; }


.hint {
  border-inline-start: 3px solid var(--gd);
  background: rgba(179, 148, 85, .08);
  padding: 6px 14px;
  margin: 8px 0
}

.hint p {
  margin: 4px 0;
  color: var(--mu)
}

/* ---- members / session / pipeline / oversight additions ---- */
.av { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; object-fit:cover; border:2px solid var(--gd); background:#0d1730; color:var(--gd); font-family:Amiri,serif; font-weight:700; flex:0 0 auto; }
.mpg { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
.mp { margin-bottom:0; }
.mp.mpx { border-top-color:var(--r); box-shadow:0 0 0 1px var(--r); }
.mph { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.mpn { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0; text-align:center; }
.mpn div { background:#0d1730; border:1px solid var(--ln); padding:6px 4px; }
.mpn b { display:block; font-family:Amiri,serif; font-size:1.5rem; color:var(--gd); line-height:1.2; }
.mpn span { font-size:.72rem; color:var(--mu); }
.mpw { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.wds { display:inline-flex; gap:5px; }
.wd { width:14px; height:14px; border-radius:50%; border:2px solid var(--ln); display:inline-block; }
.wd.on { background:var(--r); border-color:var(--r); }
.mpal { background:rgba(192,80,74,.15); border:1px solid var(--r); color:#ee8c86; font-weight:700; padding:8px 12px; margin:8px 0; animation:mpa 1.4s ease-in-out infinite; }
@keyframes mpa { 50% { background:rgba(192,80,74,.32); } }
.qb { font-size:.9rem; font-weight:700; padding:2px 14px; border:1px solid currentColor; }
.qb.okb { color:#7fcf92; background:rgba(77,161,95,.14); }
.qb.nob { color:#ee8c86; background:rgba(192,80,74,.14); }
.qg { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:10px 0; }
.qs { background:#0d1730; border:1px solid var(--ln); padding:8px 6px; text-align:center; }
.qs b { display:block; font-family:Amiri,serif; font-size:1.7rem; line-height:1.2; }
.qs span { font-size:.74rem; color:var(--mu); }
.ar { display:flex; align-items:center; gap:12px; padding:8px 4px; border-bottom:1px solid #2b3951; flex-wrap:wrap; }
.ar.arp { background:rgba(77,161,95,.06); }
.arn { flex:1 1 180px; }
.arb { display:flex; gap:6px; flex-wrap:wrap; }
.arb .b { padding:5px 12px; }
.arz { flex:1 1 100%; font-size:.74rem; }
.arz:empty { display:none; }
.b.sel { box-shadow:inset 0 0 0 2px currentColor; background:rgba(255,255,255,.1); }
#hmr { position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); background:#7a2c28; color:#fff; border:2px solid var(--gd); font-family:Amiri,serif; font-size:1.5rem; padding:10px 30px; z-index:20; opacity:0; pointer-events:none; transition:opacity .25s; text-align:center; }
#hmr.on { opacity:1; }
.gate { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.gate.gok { border-top-color:var(--g); color:#8fd69f; }
.gate.gno { border-top-color:var(--r); color:#ee8c86; }
.pl { display:flex; margin:12px 0 6px; }
.pl .stp { flex:1; position:relative; text-align:center; padding-top:24px; font-size:.78rem; color:var(--mu); line-height:1.35; }
.pl .stp:before { content:""; position:absolute; top:3px; left:50%; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:var(--bg); border:2px solid var(--ln); z-index:1; }
.pl .stp:after { content:""; position:absolute; top:9px; left:50%; width:100%; height:2px; background:var(--ln); }
.pl .stp:first-child:after { display:none; }
.pl .stp.sdn:before { background:var(--gd); border-color:var(--gd); }
.pl .stp.sdn:after { background:var(--gd); }
.pl .stp.scr { color:var(--gd); font-weight:700; }
.pl .stp.fin.ok:before { background:var(--g); border-color:var(--g); } .pl .stp.fin.ok { color:#7fcf92; }
.pl .stp.fin.no:before, .pl .stp.fin.vt:before { background:var(--r); border-color:var(--r); } .pl .stp.fin.no, .pl .stp.fin.vt { color:#ee8c86; }
.b:disabled { cursor:not-allowed; }

/* ---- v6 additions: confirm modal, action dropdown, parties, grade badge, cumulative stats ---- */
dialog::backdrop { background:rgba(5,10,25,.72); }
#cfm { width:440px; border-top:3px solid var(--gd); padding:20px 24px; }
#cfm h3 { color:var(--gd); font-size:1.45rem; margin-bottom:4px; }
#cfm .row { justify-content:flex-start; margin-bottom:0; }
#pmd { width:580px; border-top:3px solid var(--gd); padding:18px 22px; }
#pmd h3 { color:var(--gd); font-size:1.45rem; }
#pmb { max-height:50vh; overflow-y:auto; margin:8px 0; }
.stg { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:10px; margin-bottom:10px; }
.stg div { background:#0d1730; border:1px solid var(--ln); border-top:2px solid var(--gd); border-radius:6px; padding:10px 8px; text-align:center; }
.stg b { display:block; font-family:Amiri,serif; font-size:1.9rem; line-height:1.2; color:var(--gd); font-variant-numeric:tabular-nums; }
.stg span { font-size:.78rem; color:var(--mu); }
.st-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.pty { display:inline-block; border:1px solid currentColor; padding:0 10px; font-size:.78rem; font-weight:700; border-radius:4px; line-height:1.6; }
.gr { display:flex; flex-direction:column; align-items:center; min-width:64px; padding:4px 8px; border:2px solid currentColor; border-radius:6px; line-height:1.15; text-align:center; flex:0 0 auto; background:rgba(255,255,255,.03); font-variant-numeric:tabular-nums; }
.gr b { font-family:Amiri,serif; font-size:1.8rem; }
.gr span { font-size:.68rem; font-weight:700; }
.av.def { background:radial-gradient(circle at 50% 28%,#2a3a58,#0d1730); }
.av .avs { width:62%; height:62%; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.mpb { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.mpb .gap { margin-inline-start:auto; }
.dd { position:relative; border:0; padding:0; }
.dd>summary { list-style:none; cursor:pointer; user-select:none; display:inline-flex; align-items:center; }
.dd>summary::-webkit-details-marker { display:none; }
.dd[open]>summary { background:#24324b; border-color:var(--gd); }
.dd .ddm { position:absolute; inset-inline-start:0; top:calc(100% + 4px); z-index:8; min-width:200px; display:flex; flex-direction:column; gap:6px; padding:8px; background:var(--cd); border:1px solid var(--gd); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
.ptl { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #2b3951; }
.dot { width:16px; height:16px; border-radius:50%; flex:0 0 auto; display:inline-block; }

/* ---- circular swatches & custom Arabic file upload ---- */
.sw-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0; }
.sw { width:28px; height:28px; min-width:28px; min-height:28px; flex:0 0 28px; border-radius:50%; border:2px solid rgba(255,255,255,.28); cursor:pointer; padding:0; display:inline-block; transition:transform .12s ease,box-shadow .12s ease; }
.sw:hover { transform:scale(1.1); }
.sw.on { border-color:#fff; box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gd); transform:scale(1.08); }
input[type=color] { padding:3px; width:56px; min-width:56px; flex:0 0 56px !important; height:40px; cursor:pointer; border-radius:6px; }
.file-box { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#0d1730; border:1px solid #485b7a; border-radius:6px; padding:5px 10px; min-height:40px; }
.file-btn { min-height:30px; padding:5px 12px; font-size:.86rem; flex:0 0 auto; cursor:pointer; }
.file-name { font-size:.83rem; color:var(--mu); flex:1 1 120px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ppv { width:56px; height:56px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 56px; overflow:hidden; border:2px solid var(--gd); background:#0d1730; box-shadow:0 2px 10px rgba(0,0,0,.35); }
.ppv img { width:100%; height:100%; object-fit:cover; display:block; }

/* ---- dashboard manual editing & AI alerts ---- */
.dash-edit-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.ov-edit { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
.step-btn { min-height:30px; min-width:34px; padding:3px 9px; font-size:.82rem; font-variant-numeric:tabular-nums; }
.num-mini { width:72px; min-height:30px; padding:4px 6px; text-align:center; direction:ltr; font-variant-numeric:tabular-nums; }
.tile-edit { grid-column:1/-1; display:flex; align-items:center; gap:4px; margin-top:6px; padding-top:6px; border-top:1px solid rgba(59,74,99,.7); flex-wrap:wrap; }
.tile-edit .num-mini { width:58px; flex:1 1 54px; }
.row-edit { display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; }
.ai-err { background:rgba(192,80,74,.14); border:1px solid var(--r); border-inline-start:4px solid var(--r); border-radius:6px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.ai-err b { color:#f29b95; display:block; margin-bottom:2px; }
.ai-ok { background:rgba(77,161,95,.12); border:1px solid var(--g); border-inline-start:4px solid var(--g); border-radius:6px; padding:10px 14px; margin:8px 0; color:#9de0ad; }
.preset-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
.fb-box { background:#0d1730; border:1px solid var(--ln); border-radius:6px; padding:12px 14px; margin-top:10px; }

/* ---- v7 additions: parties tab ---- */
.plg { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; border-radius:50%; object-fit:cover; background:#0d1730; border:2px solid var(--ln); vertical-align:middle; }
.plg.def { color:#0B132B; font-weight:800; border-color:transparent; direction:ltr; }
.pty .plg { border-radius:50%; border-width:1px; margin-inline-end:5px; vertical-align:-4px; }
.ptg { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
.pcd { margin-bottom:0; }
.pml { max-height:230px; overflow-y:auto; border:1px solid var(--ln); border-radius:6px; padding:4px 10px; margin:10px 0; background:#0d1730; }
.pmr { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #2b3951; }
.pmr .b { min-height:30px; padding:3px 10px; font-size:.8rem; }
.ptl input[type=checkbox] { width:18px; height:18px; flex:0 0 auto; }
@media(max-width:760px) {
  .nt { display:none; }
  .mnc { display:inline; }
  .ptg,.mpg { grid-template-columns:1fr; }
  .hd { padding:12px 14px; }
  main { padding:14px 14px 44px; }
}

/* ---- balanced dual-impact cards ---- */
.imp-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0 14px; }
.imp-box { background:#0d1730; border:1px solid var(--ln); border-radius:6px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.imp-box.pass { border-top:3px solid var(--g); }
.imp-box.rej { border-top:3px solid var(--r); }
.imp-title { font-weight:700; font-size:1rem; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; border-bottom:1px solid rgba(59,74,99,.6); padding-bottom:6px; }
.imp-box.pass .imp-title { color:#8fd69f; }
.imp-box.rej .imp-title { color:#f29b95; }
.imp-sub { border-radius:6px; padding:11px 13px; border:1px solid rgba(59,74,99,.8); display:flex; flex-direction:column; gap:8px; }
.imp-sub.pos { background:rgba(77,161,95,.07); border-inline-start:3px solid var(--g); }
.imp-sub.neg { background:rgba(192,80,74,.07); border-inline-start:3px solid var(--r); }
.imp-lbl { font-size:.9rem; font-weight:700; display:block; margin-bottom:2px; }
.imp-sub.pos .imp-lbl { color:#8fd69f; }
.imp-sub.neg .imp-lbl { color:#f29b95; }
.imp-chips { display:flex; flex-wrap:wrap; gap:2px; }
.imp-list { display:flex; flex-direction:column; gap:8px; margin-top:2px; }
.imp-item { display:flex; flex-direction:column; gap:5px; background:rgba(11,19,43,.5); border:1px solid rgba(59,74,99,.5); border-radius:5px; padding:8px 10px; font-size:.84rem; line-height:1.6; }
.imp-item .chip { align-self:flex-start; margin:0; }
.imp-why { color:#dbe4f0; display:block; }
.bill-dash { background:#0d1730; border:1px solid var(--ln); border-inline-start:3px solid var(--gd); border-radius:6px; padding:10px 12px; margin:10px 0; }
.bill-dash-hd { font-size:.82rem; font-weight:700; color:var(--gd); margin-bottom:7px; }
.bill-dash-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px; }
.bill-dash-item { background:rgba(30,41,59,.65); border:1px solid rgba(59,74,99,.6); border-radius:4px; padding:6px 9px; display:flex; flex-direction:column; gap:2px; font-size:.8rem; }
.bill-dash-top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.bill-arts { margin:6px 0 8px; padding-inline-start:20px; color:var(--tx); font-size:.93rem; line-height:1.7; }
.bill-arts li { margin-bottom:3px; }
@media(max-width:760px) { .imp-grid { grid-template-columns:1fr; } }
</style>
</head>

const IND_BY_NAME = {};
D.forEach((sec, si) => {
  sec[3].forEach((row) => { IND_BY_NAME[row[0]] = { n: row[0], s: si }; });
});

function hasIndicator(name) {
  return typeof BY !== "undefined" ? !!BY[name] : !!IND_BY_NAME[name];
}

function sectorOfIndicator(name) {
  if (typeof BY !== "undefined" && BY[name]) return BY[name].s;
  return IND_BY_NAME[name] ? IND_BY_NAME[name].s : 9;
}

function profileOfEffects(y, n) {
  const sumSide = (obj, sign) =>
    Object.values(obj || {}).reduce((acc, v) => acc + (v * sign > 0 ? Math.abs(v) : 0), 0);
  const py = sumSide(y, 1);
  const ny = sumSide(y, -1);
  const pn = sumSide(n, 1);
  const nn = sumSide(n, -1);
  if (py >= ny * 1.4 && nn >= pn * 1.25) return "sound";
  if (ny >= py * 1.4 && pn >= nn * 1.25) return "costly";
  return "balanced";
}

function classifyPolicy(title, summary, hits, text) {
  const costlyFiscal = COSTLY_POPULIST_RX.test(text);
  const costlyMarket = COSTLY_MARKET_RX.test(text);
  const costlyRights = COSTLY_RIGHTS_RX.test(text);
  const costlyCuts = COSTLY_CUTS_RX.test(text);
  const hasTaxCut = hits.some((h) => h.rule.id === "tax" && ruleIsDec(text, h.rule));
  const hasSpendInc = hits.some((h) => ["budget", "pension", "health"].includes(h.rule.id) && !ruleIsDec(text, h.rule));
  const contradictoryFiscal = hasTaxCut && hasSpendInc && !norm("تقليص العجز تمويل متوازن").split(" ").some((w) => text.includes(w));

  const costlyFlags = [costlyFiscal, costlyMarket, costlyRights, costlyCuts, contradictoryFiscal].filter(Boolean).length;
  const soundMatches = (text.match(new RegExp(SOUND_GOVERNANCE_RX.source, "g")) || []).length;
  const controversialCount = hits.filter((h) => CONTROVERSIAL_RULE_IDS.has(h.rule.id)).length;

  let profile = "balanced";
  if (costlyFlags >= 1) {
    profile = "costly";
  } else if (soundMatches >= 1 && controversialCount === 0) {
    profile = "sound";
  } else if (soundMatches >= 2 && controversialCount <= 1) {
    profile = "sound";
  } else if (hits.length > 0 && controversialCount === 0 && !hits.some((h) => ruleIsDec(text, h.rule) && ["health", "edu", "infra", "disaster", "rights", "vote"].includes(h.rule.id))) {
    profile = "sound";
  }
  return {
    profile,
    costlyFiscal,
    costlyMarket,
    costlyRights,
    costlyCuts,
    contradictoryFiscal,
    fiscalMention: FISCAL_MENTION_RX.test(text) || costlyFiscal || contradictoryFiscal,
  };
}

  "الاستقطاب الحزبي": ["التوافق المؤسسي المتوازن في «{T}» يخفف حدة الانقسام الحزبي", "الأطروحات الحادة أو الإقصائية في «{T}» تعمق الاستقطاب السياسي في المجلس", "تجنب تمرير مشروع خلافي عبر «{T}» يمنع انفجار انقسام حزبي أوسع", "إسقاط «{T}» يكرّس الجمود المتبادل ويزيد حدة التجاذب السياسي"],
  "الثقة بالإعلام": ["حماية استقلال الصحافة وتدفق المعلومات في «{T}» تعزز الثقة بالإعلام", "التدخل في حرية النشر أو التغطية في «{T}» يضعف مصداقية المشهد الإعلامي", "رفض «{T}» يحمي البيئة الإعلامية من القيود ويعزز التعددية", "إسقاط «{T}» يؤجل تدابير الشفافية ومكافحة التضليل المنظم"]
};

function shortBillLabel(title) {
  const clean = String(title || "").replace(/^(قانون|مشروع قانون|قرار|مرسوم)\s+/u, "").trim();
  const words = clean.split(/\s+/).filter(Boolean).slice(0, 5);
  return words.join(" ") || "المشروع";
}

function cleanReasonText(str) {
  let s = String(str || "")
    .replace(/\\n|\\r/g, " ")
    .replace(/[\r\n]+/g, " ")
    .replace(/^(?:البعد الاقتصادي والمالي|البعد الاجتماعي والمعيشي|البعد التنظيمي والإداري|آلية التأثير الزمنية والفئات المتأثرة)\s*:\s*/u, "")
    .replace(/\s{2,}/g, " ")
    .trim();
  return s;
}

function buildIndicatorReason(indName, delta, passed, title) {
  const tpl = IND_WHY[indName];
  const shortT = shortBillLabel(title);
  const core = tpl
    ? tpl[passed ? (delta > 0 ? 0 : 1) : (delta > 0 ? 2 : 3)].replace(/\{T\}/g, shortT)
    : (passed
        ? (delta > 0
            ? "تفعيل بنود «" + shortT + "» يدعم أداء مؤشر «" + indName + "» بصورة مباشرة"
            : "تنفيذ «" + shortT + "» يفرض تكلفة أو ضغطاً تنظيمياً على «" + indName + "»")
        : (delta > 0
            ? "إسقاط «" + shortT + "» يجنّب «" + indName + "» الأعباء والتداعيات الجانبية"
            : "رفض «" + shortT + "» يُبقي التحديات القائمة في «" + indName + "» دون معالجة"));
  return /[.؟!]$/.test(core) ? core : core + ".";
}

/* Direction is judged per topic: a cut/restriction word must appear
   right next to the topic keyword (18 chars before or 4 after). */
function nearDec(text, idx, len) {
  return DEC_RX.test(text.slice(Math.max(0, idx - 18), idx + len + 4));
}

function ruleIsDec(text, rule) {
  return rule.kw.some(k => {
    const key = norm(k);
    let i = text.indexOf(key);
    while (i !== -1) {
      if (nearDec(text, i, key.length)) return true;
      i = text.indexOf(key, i + 1);
    }
    return false;
  });
}

function analyze(title, summary) {
  const text = norm((title + " " + title + " " + summary).toLowerCase());

  let hits = RULES
    .map(rule => ({ rule, score: rule.kw.filter(k => text.includes(norm(k))).length }))
    .filter(h => h.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 4);

  const hasIntelExpand = hits.some(h => h.rule.id === "intel" && !ruleIsDec(text, h.rule));
  const protectsPrivacy = new RegExp(["حمايه الخصوصيه", "صون الخصوصيه", "تعزيز الخصوصيه", "حمايه الحريات", "حريه التعبير"].map(norm).join("|")).test(text);
  if (hasIntelExpand && !protectsPrivacy) {
    hits = hits.filter(h => h.rule.id !== "rights");
  }

  const countries = COUNTRIES.filter(c => c.rx.test(text));
  const hasDiplomacy = hits.some(h => h.rule.id === "foreign" || h.rule.id === "sanc");
  if (countries.length && !hasDiplomacy) {
    hits.push({ rule: RULES.find(r => r.id === "foreign"), score: 1 });
  }

  const meta = classifyPolicy(title, summary, hits, text);
  const weights = [1, 0.72, 0.52, 0.45];
  const effects = {};
  const add = (name, value) => {
    if (!name || !value) return;
    effects[name] = (effects[name] || 0) + value;
  };
  let sanctionsDec = null;

  hits.forEach((hit, i) => {
    const dec = ruleIsDec(text, hit.rule);
    if (hit.rule.id === "sanc") sanctionsDec = dec;
    const set = dec ? hit.rule.dec : hit.rule.inc;
    Object.entries(set).forEach(([name, value]) => add(name, value * weights[i]));
  });

  countries.forEach(c => {
    const m = text.match(c.rx);
    const dec = nearDec(text, m.index, m[0].length);
    let value = dec ? -5 : 5;
    if (sanctionsDec !== null) value = sanctionsDec ? 6 : -8;
    add(c.ind, value);
  });

  /* Inject targeted damages ONLY when costly/populist patterns actually appear in text */
  if (meta.costlyFiscal || meta.contradictoryFiscal) {
    add("العجز المالي", -7);
    add("معدل التضخم", -6);
    add("الدين العام الفيدرالي", -5);
    add("مؤشر ثقة المستثمرين", -4);
    add("العدالة الاجتماعية", 2);
    add("نسبة تأييد المجلس التشريعي", 2);
  }
  if (meta.costlyMarket) {
    add("مؤشر ثقة المستثمرين", -6);
    add("استقلالية سلاسل الإمداد", -5);
    add("الناتج المحلي الإجمالي GDP", -4);
    add("معدل التضخم", -4);
    add("العدالة الاجتماعية", 2);
  }
  if (meta.costlyRights) {
    add("حرية التعبير والصحافة", -7);
    add("الخصوصية والرقابة الحكومية", -7);
    add("الثقة بالحكومة الفيدرالية", -5);
    add("مؤشر السلم الأهلي", -4);
    add("مكافحة الإرهاب الداخلي", 2);
  }
  if (meta.costlyCuts) {
    add("جودة الرعاية الصحية", -6);
    add("جودة التعليم العام", -5);
    add("العدالة الاجتماعية", -5);
    add("العجز المالي", 2);
  }

  /* Strip incidental fiscal spillover when text contains zero fiscal cues and profile isn't costly */
  if (!meta.fiscalMention && !hits.some((h) => ["tax", "budget", "pension", "monetary"].includes(h.rule.id))) {
    delete effects["العجز المالي"];
    delete effects["الدين العام الفيدرالي"];
  }

  return { effects, labels: hits.map(h => h.rule.label), hits, meta, text };
}

function ensureBalancedEffects(rawEffects, isPass, ctx) {
  const out = {};
  Object.entries(rawEffects || {}).forEach(([name, val]) => {
    const num = Math.max(-15, Math.min(15, Math.round(Number(val))));
    if (hasIndicator(name) && Number.isFinite(num) && num !== 0) out[name] = num;
  });
  let entries = Object.entries(out);
  if (!entries.length) {
    /* Domain-neutral fallback only when no rule matched at all */
    if (isPass) {
      out["الثقة بالحكومة الفيدرالية"] = 2;
      out["نسبة تأييد المجلس التشريعي"] = 2;
      out["الاستقطاب الحزبي"] = -2;
      out["الثقة بالإعلام"] = -1;
    } else {
      out["الاستقطاب الحزبي"] = 2;
      out["الثقة بالإعلام"] = 1;
      out["الثقة بالحكومة الفيدرالية"] = -2;
      out["نسبة تأييد المجلس التشريعي"] = -2;
    }
    return out;
  }

  const primarySector = sectorOfIndicator(entries.slice().sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0][0]);
  const sectorPair = SECTOR_TRADEOFFS[primarySector] || SECTOR_TRADEOFFS[9];
  const profile = ctx && ctx.profile ? ctx.profile : "balanced";
  const allowFiscal = Boolean(
    (ctx && ctx.fiscalMention) ||
    ("العجز المالي" in out) ||
    ("الدين العام الفيدرالي" in out) ||
    primarySector === 1 || primarySector === 2
  );

  const filterPool = (pool) =>
    pool.filter((k) => hasIndicator(k) && !(k in out) && (allowFiscal || (k !== "العجز المالي" && k !== "الدين العام الفيدرالي")));

  let posCount = entries.filter(([, v]) => v > 0).length;
  let negCount = entries.filter(([, v]) => v < 0).length;

  if (posCount === 0) {
    const posPool = filterPool(sectorPair.pos.concat(["الثقة بالحكومة الفيدرالية", "نسبة تأييد المجلس التشريعي", "استقرار الولايات"]));
    if (posPool.length) {
      out[posPool[0]] = isPass ? (profile === "costly" ? 1 : 2) : (profile === "costly" ? 3 : 2);
      posCount += 1;
    }
  }
  if (negCount === 0) {
    const negPool = filterPool(sectorPair.neg.concat(["الاستقطاب الحزبي", "الثقة بالحكومة الفيدرالية", "استقرار الولايات"]));
    if (negPool.length) {
      out[negPool[0]] = isPass ? (profile === "sound" ? -1 : -2) : (profile === "costly" ? -1 : -2);
      negCount += 1;
    }
  }
  while (Object.keys(out).length < 3) {
    const pool = posCount <= negCount
      ? filterPool(sectorPair.pos.concat(["الثقة بالحكومة الفيدرالية", "نسبة تأييد المجلس التشريعي"]))
      : filterPool(sectorPair.neg.concat(["الاستقطاب الحزبي", "استقرار الولايات"]));
    if (!pool.length) break;
    const isP = posCount <= negCount;
    out[pool[0]] = isP ? 2 : -2;
    if (isP) posCount += 1;
    else negCount += 1;
  }
  return out;
}

function capEffectsMix(rawEffects, maxTotal) {
  const entries = Object.entries(rawEffects || {});
  if (entries.length <= maxTotal) return rawEffects;
  const pos = entries.filter(([, v]) => v > 0).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const neg = entries.filter(([, v]) => v < 0).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const picked = [];
  if (pos.length) picked.push(pos.shift());
  if (neg.length) picked.push(neg.shift());
  const rest = pos.concat(neg).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  while (picked.length < maxTotal && rest.length) {
    picked.push(rest.shift());
  }
  return Object.fromEntries(picked);
}

function runEngine({ title, summary, passed, yes, no }) {
  const a = analyze(title, summary);
  const profile = a.meta.profile;
  const total = yes + no;
  const margin = total > 0 ? Math.abs(yes - no) / total : 0;
  const scale = total > 0 ? 0.78 + 0.44 * margin : 1;

  const rawEffects = {};
  const entries = Object.entries(a.effects);

  if (profile === "sound") {
    entries.forEach(([name, baseVal]) => {
      if (passed) {
        const mult = baseVal > 0 ? 1.25 : 0.55;
        let v = Math.round(baseVal * scale * mult);
        if (v === 0 && Math.abs(baseVal) >= 0.4) v = baseVal > 0 ? 1 : -1;
        v = Math.max(-4, Math.min(12, v));
        if (v !== 0 && hasIndicator(name)) rawEffects[name] = v;
      } else {
        const mult = baseVal > 0 ? -0.88 : -0.45;
        let v = Math.round(baseVal * scale * mult);
        if (v === 0 && Math.abs(baseVal) >= 0.5) v = baseVal > 0 ? -1 : 1;
        v = Math.max(-10, Math.min(3, v));
        if (v !== 0 && hasIndicator(name)) rawEffects[name] = v;
      }
    });
  } else if (profile === "costly") {
    let posKept = 0;
    const sorted = entries.slice().sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
    sorted.forEach(([name, baseVal]) => {
      if (passed) {
        if (baseVal > 0) {
          if (posKept >= 2) return;
          posKept += 1;
          const v = Math.max(1, Math.min(3, Math.round(baseVal * 0.55 * scale)));
          if (hasIndicator(name)) rawEffects[name] = v;
        } else {
          const v = Math.max(-12, Math.min(-3, Math.round(baseVal * 1.15 * scale)));
          if (hasIndicator(name)) rawEffects[name] = v;
        }
      } else {
        if (baseVal < 0) {
          const v = Math.max(2, Math.min(8, Math.round(Math.abs(baseVal) * 0.72 * scale)));
          if (hasIndicator(name)) rawEffects[name] = v;
        } else {
          const v = Math.max(-2, Math.min(-1, -Math.round(baseVal * 0.45 * scale)));
          if (hasIndicator(name)) rawEffects[name] = v;
        }
      }
    });
  } else {
    const direction = passed ? 0.95 : -0.68;
    entries.forEach(([name, baseVal]) => {
      const scaled = baseVal * scale * direction;
      let v = Math.max(-10, Math.min(10, Math.round(scaled)));
      if (v === 0 && Math.abs(scaled) >= 0.3) v = scaled > 0 ? 1 : -1;
      if (v !== 0 && hasIndicator(name)) rawEffects[name] = v;
    });
  }

  const labels = Object.keys(rawEffects).length ? a.labels : ["تشريع عام"];
  const balanced = ensureBalancedEffects(rawEffects, passed, { profile, hits: a.hits, text: a.text, fiscalMention: a.meta.fiscalMention });
  const effects = capEffectsMix(balanced, 5);
  const why = {};
  Object.entries(effects).forEach(([name, delta]) => {
    why[name] = buildIndicatorReason(name, delta, passed, title);
  });
  return { effects, labels, why, profile };
}

function makeStatement({ title, passed, vote }, effects, labels) {
  const ranked = Object.entries(effects).sort((x, y) => y[1] - x[1]);
  const best = ranked[0];
  const worst = ranked[ranked.length - 1];
  const market = (effects["مؤشر ثقة المستثمرين"] || 0) + (effects["الناتج المحلي الإجمالي GDP"] || 0);

  let s = (passed ? "أقر" : "رفض") + " المجلس التشريعي الفيدرالي «" + title + "»" + (vote ? " بنتيجة " + vote : "") + ". ";
  s += market > 1 ? "استقبلت الأسواق القرار بارتياح لافت. "
     : market < -1 ? "تفاعلت الأسواق بحذر ملحوظ مع تداعيات القرار. "
     : "حافظت الأسواق على استقرارها النسبي. ";
  if (best && best[1] > 0) s += "سُجّل أثر إيجابي أبرزُه في مؤشر «" + best[0] + "». ";
  if (worst && worst[1] < 0) s += "مقابل ضغط واضح على مؤشر «" + worst[0] + "». ";
  s += "وتتباين التقديرات النيابية بشأن ملف " + labels.join(" و") + ".";
  return s;
}

function formatWeightPair(effects) {
  const entries = Object.entries(effects || {}).filter(([n]) => BY[n]);
  const pos = entries.reduce((acc, [, v]) => acc + (v > 0 ? v : 0), 0);
  const neg = entries.reduce((acc, [, v]) => acc + (v < 0 ? Math.abs(v) : 0), 0);
  return { pos, neg, posCount: entries.filter(([, v]) => v > 0).length, negCount: entries.filter(([, v]) => v < 0).length };
}

function expandText(c, s, y) {
  const base = cleanReasonText(s);
  if (base.length >= 240) return base;
  const affected = listNames(y, 1).concat(listNames(y, -1)).filter((v, i, a) => a.indexOf(v) === i).slice(0, 4);
  const parts = [base];
  parts.push("ويندرج المشروع ضمن اختصاص " + (c || "اللجنة المختصة") + " مع تحديد آليات التنفيذ والرقابة على المخرجات.");
  if (affected.length) {
    parts.push("وتشمل مجالات التأثير الأساسية للمشروع كلاً من: " + affected.join("، ") + ".");
  }
  return parts.join(" ");
}

function hintText(y, n) {
  const passImpacted = listNames(y, 1).concat(listNames(y, -1)).filter((v, i, a) => a.indexOf(v) === i).slice(0, 4);
  const rejImpacted = listNames(n, 1).concat(listNames(n, -1)).filter((v, i, a) => a.indexOf(v) === i).slice(0, 4);
  const pTxt = passImpacted.length ? passImpacted.join("، ") : "المؤشرات القطاعية المرتبطة";
  const rTxt = rejImpacted.length ? rejImpacted.join("، ") : "المؤشرات القطاعية المرتبطة";
  return `تتوزع التأثيرات المتوقعة عند الإقرار بصورة رئيسية على: ${pTxt}، بينما تتركز تداعيات الرفض على: ${rTxt}.`;
}

const topNames = (effects, dir) =>
  Object.entries(effects)
    .filter((e) => BY[e[0]] && e[1] * dir > 0)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
    .slice(0, 3)
    .map((e) => e[0])
    .join("، ") || "المؤشرات العامة";

/* turn a library entry into an agenda item (engine derives missing parts) */
function instantiate(L) {
  const passEng = runEngine({ title: L.t, summary: L.s, passed: true, yes: 0, no: 0 });
  const failEng = runEngine({ title: L.t, summary: L.s, passed: false, yes: 0, no: 0 });
  const y = ensureBalancedEffects(L.y || passEng.effects, true, { profile: L.profile || passEng.profile });
  const n = ensureBalancedEffects(L.n || failEng.effects, false, { profile: L.profile || passEng.profile });
  const profile = L.profile || (L.y ? profileOfEffects(y, n) : passEng.profile);
  const yw = ensureReasons(y, L.yw || passEng.why, true, L.t);
  const nw = ensureReasons(n, L.nw || failEng.why, false, L.t);
  const rationale = L.rationale ? cleanReasonText(L.rationale) : "";
  const articles = Array.isArray(L.articles) ? L.articles.map(cleanReasonText).filter(Boolean) : [];
  uid += 1;
  return {
    id: "x" + Date.now().toString(36) + uid,
    lk: L.no, no: L.no, c: L.c, t: L.t, y, n, yw, nw, profile,
    rationale,
    articles,
    s: expandText(L.c, L.s, y),
    h: (L.h && !LEGACY_BOILERPLATE_RX.test(L.h)) ? cleanReasonText(L.h) : hintText(y, n),
    st: L.st || makeStatement({ title: L.t, passed: true, vote: "" }, y, passEng.labels),
    sn: L.sn || makeStatement({ title: L.t, passed: false, vote: "" }, n, failEng.labels),
    ins: today(),
    vd: "",
  };
}

function buildFallbackBill(actNo) {
  const item = CURATED_DRAFTS[(actNo - 1) % CURATED_DRAFTS.length];
  return {
    no: "FLC-ACT-2026-" + pad(actNo),
    actNo,
    c: D[item[0]][1],
    t: "قانون " + item[1],
    s: item[2],
  };
}

function defaultState() {
  const v = {};
  ALL.forEach((x) => { v[x.n] = x.df; });
  const ag = LIBRARY.slice(0, AGENDA_SIZE).map(instantiate);
  let act = 0;
  while (ag.length < AGENDA_SIZE) {
    act += 1;
    const g = buildFallbackBill(act);
    const b = instantiate(g);
    b.actNo = g.actNo;
    ag.push(b);
  }
  return {
    v,
    base: { ...v },
    log: [],
    dec: [],
    ag,
    deferred: [],
    defLog: [],
    reports: [],
    sched: { days: [1, 2, 3, 4, 5] },
    sess: { no: "2026-14", date: today(), type: "session", sid: "d0" },
    cnt: { roll: 118, act },
    members: [],
    att: {},
    asm: { sid: "", started: false, t: 0, present: 0, total: 0 },
    parties: [],
    /* cumulative counters: they only grow when something is added, never when a record is deleted */
    stats: { laws: ag.length, dec: 0, pass: 0, rej: 0, sess: 1 },
    qpct: 50,
  };
}

/* also upgrades data saved by the previous version of the platform */
function fixState(x) {
  const d = defaultState();
  if (!x || !x.v || !Array.isArray(x.log)) x = d;
  x.dec = x.dec || [];
  x.base = x.base || { ...x.v };
  x.cnt = Object.assign({ roll: 118, act: 0 }, x.cnt);
  x.sess = Object.assign({}, d.sess, x.sess);
  delete x.sess.status;
  delete x.sess.outcome;
  if (!Array.isArray(x.ag)) x.ag = d.ag;
  if (x.done) {
    x.ag = x.ag.filter((b) => !x.done[b.id]);
    delete x.done;
  }
  x.deferred = x.deferred || [];
  x.defLog = x.defLog || [];
  x.reports = x.reports || [];
  x.sched = x.sched && Array.isArray(x.sched.days) ? x.sched : d.sched;
  x.members = Array.isArray(x.members) ? x.members : [];
  x.members.forEach((m) => {
    m.id = m.id || "m" + Math.random().toString(36).slice(2, 9);
    m.name = m.name || "—";
    m.party = m.party || "";
    m.pos = RANK_MIGRATE[m.pos] || (POSITIONS.includes(m.pos) ? m.pos : "Congressman");
    delete m.bloc;
    m.img = m.img || "";
    m.warns = Array.isArray(m.warns) ? m.warns : [];
    m.prop = m.prop || 0;
    m.adj = Object.assign({ p: 0, e: 0, u: 0 }, m.adj);
  });
  x.parties = (Array.isArray(x.parties) ? x.parties : []).filter((p) => p && typeof p === "object");
  x.parties.forEach((p) => {
    p.id = p.id || "p" + Math.random().toString(36).slice(2, 9);
    p.name = String(p.name || "—");
    p.abbr = String(p.abbr || "").slice(0, 6);
    p.color = /^#[0-9a-fA-F]{6}$/.test(p.color) ? p.color : "#B39455";
    p.logo = typeof p.logo === "string" ? p.logo : "";
    p.chair = p.chair || "";
    p.vice = p.vice || "";
  });
  x.att = x.att && typeof x.att === "object" && !Array.isArray(x.att) ? x.att : {};
  x.asm = Object.assign({ sid: "", started: false, t: 0, present: 0, total: 0 }, x.asm);
  delete x.ovs;
  x.qpct = typeof x.qpct === "number" ? x.qpct : 50;
  ALL.forEach((a) => {
    if (!(a.n in x.v)) x.v[a.n] = a.df;
    if (!(a.n in x.base)) x.base[a.n] = x.v[a.n];
  });
  x.log.forEach((l) => {
    l.date = l.date || iso(l.t);
    l.time = l.time || hm(l.t);
    l.changes = l.changes || [];
    if (l.sid === undefined) l.sid = l.sess === x.sess.no ? x.sess.sid : "";
  });
  x.reports.forEach((r) => {
    ["passed", "rejected", "deferred", "changes"].forEach((k) => { r[k] = r[k] || []; });
  });
  /* political parties */
  x.parties = (Array.isArray(x.parties) ? x.parties : []).filter((p) => p && typeof p === "object");
  x.parties.forEach((p) => {
    p.id = p.id || "p" + Math.random().toString(36).slice(2, 9);
    p.name = String(p.name || "—");
    p.color = /^#[0-9a-fA-F]{6}$/.test(p.color) ? p.color : "#B39455";
  });
  /* proposed-laws credit per member is a stored cumulative number */
  const sponsored = {};
  const seenBills = new Set();
  x.ag.concat(x.deferred, x.log.map((l) => l.bill)).forEach((b) => {
    if (!b || !b.id || seenBills.has(b.id)) return;
    seenBills.add(b.id);
    if (b.sp) sponsored[b.sp] = (sponsored[b.sp] || 0) + 1;
  });
  x.members.forEach((m) => {
    if (typeof m.prop !== "number" || !(m.prop >= 0)) m.prop = sponsored[m.id] || 0;
    if (!x.parties.some((p) => p.id === m.party)) m.party = "";
  });
  /* cumulative statistics: built once from existing data, then only increased */
  if (!x.stats || typeof x.stats !== "object") {
    const sids = new Set();
    x.log.forEach((l) => { if (l.sid || l.sess) sids.add(l.sid || l.sess); });
    x.reports.forEach((r) => { if (r.sid) sids.add(r.sid); });
    if (x.sess.type === "session") sids.add(x.sess.sid);
    x.stats = {
      laws: seenBills.size,
      dec: x.log.length,
      pass: x.log.filter((l) => l.result === "Passed").length,
      rej: x.log.filter((l) => l.result !== "Passed").length,
      sess: Math.max(1, sids.size),
    };
  }
  ["laws", "dec", "pass", "rej", "sess"].forEach((k) => { x.stats[k] = Math.max(0, Number(x.stats[k]) || 0); });
  const upgradeBill = (b) => {
    if (!b || typeof b !== "object") return;
    delete b.p;
    delete b.o;
    delete b.yp;
    delete b.yn;
    delete b.np;
    delete b.nn;
    b.y = ensureBalancedEffects(b.y || {}, true);
    b.n = ensureBalancedEffects(b.n || {}, false);
    b.profile = b.profile || profileOfEffects(b.y, b.n);
    b.yw = ensureReasons(b.y, b.yw, true, b.t);
    b.nw = ensureReasons(b.n, b.nw, false, b.t);
    if (b.rationale) b.rationale = cleanReasonText(b.rationale);
    if (Array.isArray(b.articles)) b.articles = b.articles.map(cleanReasonText).filter(Boolean);
    b.s = expandText(b.c, b.s, b.y);
    if (!b.h || LEGACY_BOILERPLATE_RX.test(b.h) || /الميزان الاستراتيجي|تحذير: تشريع شعبوي|تشريع مدروس وعالي الجدوى|تشريع جدلي متقارب الكفتين/.test(b.h)) {
      b.h = hintText(b.y, b.n);
    }
  };
  x.ag.forEach(upgradeBill);
  x.deferred.forEach(upgradeBill);
  x.log.forEach((l) => upgradeBill(l.bill));
  return x;
}

let dbPromise = null;
let dbStatus = "جارٍ فحص قاعدة البيانات";

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open("flc_usa_db", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) {
      reject(e);
    }
  });
  return dbPromise;
}

function dbGet(key) {
  return openDb().then(
    (db) =>
      new Promise((resolve, reject) => {
        const q = db.transaction("kv").objectStore("kv").get(key);
        q.onsuccess = () => resolve(q.result);
        q.onerror = () => reject(q.error);
      })
  );
}

function dbPut(key, value) {
  return openDb().then(
    (db) =>
      new Promise((resolve, reject) => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      })
  );
}

function readLocal() {
  try {
    const raw =
      localStorage.getItem(STORE_KEY) ||
      localStorage.getItem(OLD_KEYS[0]) ||
      localStorage.getItem(OLD_KEYS[1]);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

    localStorage.setItem(STORE_KEY, JSON.stringify(S));
  } catch (e) {
    /* storage may be unavailable */
  }
  dbPut("state", S)
    .then(() => dbPut("snap:" + today(), S))
    .then(() => { dbStatus = "IndexedDB نشطة مع نسخة LocalStorage احتياطية"; })
    .catch(() => { dbStatus = "IndexedDB غير متاحة: يعمل النظام عبر LocalStorage"; });
}

/* =========================================================
   DASHBOARD + MANUAL EDITING FOR STATE & 10 SECTORS
   ========================================================= */
function distributeTarget(names, target) {
  const t = clamp(Number(target));
  const curVals = names.map((n) => S.v[n]);
  const curAvg = Math.round(curVals.reduce((a, b) => a + b, 0) / names.length);
  if (t === curAvg) return null;
  const targetSum = t * names.length;
  const next = {};
  names.forEach((n) => { next[n] = S.v[n]; });
  let diff = targetSum - curVals.reduce((a, b) => a + b, 0);
  let guard = 0;
  while (diff !== 0 && guard < 200) {
    guard += 1;
    const step = diff > 0 ? 1 : -1;
    let moved = false;
    for (const n of names) {
      if (diff === 0) break;
      const cand = next[n] + step;
      if (cand >= 0 && cand <= 100) {
        next[n] = cand;
        diff -= step;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return next;
}

/* =========================================================
   STATE OPERATIONS
   Every change goes through commit(). When Firebase sync is on, the same
   operation is replayed on the latest shared copy, so two supervisors
   working together do not overwrite each other.
   ========================================================= */
const clone = (x) => JSON.parse(JSON.stringify(x));
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const voteText = (y, n, a) =>
  y == null || n == null ? "" : `${y} مؤيد - ${n} معارض - ${a ?? 0} ممتنع`;

const dayEntries = (s) => s.log.filter((l) => l.sid === s.sess.sid);
const dayDeferred = (s) => s.defLog.filter((x) => x.sid === s.sess.sid);
const dayActivity = (s) => dayEntries(s).length + dayDeferred(s).length > 0;
const dayDone = (s) => s.sess.type === "session" && !s.ag.length && dayActivity(s);

const generalOf = (values) => Math.round(ALL.reduce((sum, x) => sum + values[x.n], 0) / ALL.length);

/* closing minutes of the current legislative day */
function buildReport(s) {
  const entries = dayEntries(s).slice().reverse();
  const slim = (l) => ({ t: l.t, ref: l.ref, title: l.title, yes: l.yes, no: l.no, abs: l.abs ?? null });
  return {
    sid: s.sess.sid,
    no: s.sess.no,
    date: s.sess.date,
    passed: entries.filter((l) => l.result === "Passed").map(slim),
    rejected: entries.filter((l) => l.result !== "Passed").map(slim),
    deferred: dayDeferred(s).map((x) => ({ no: x.no, t: x.t, auto: !!x.auto })),
    changes: ALL.filter((x) => s.v[x.n] !== s.base[x.n]).map((x) => [x.n, s.base[x.n], s.v[x.n]]),
    g0: generalOf(s.base),
    g1: generalOf(s.v),
  };
}

/* created automatically once the agenda is finished, then kept up to date */
function syncReport(s) {
  if (s.sess.type !== "session") return;
  const i = s.reports.findIndex((r) => r.sid === s.sess.sid);
  if (!dayActivity(s)) {
    if (i >= 0) s.reports.splice(i, 1);
    return;
  }
  const complete = !s.ag.length;
  if (!complete && i < 0) return;
  const r = { ...buildReport(s), complete };
  if (i >= 0) s.reports[i] = r;
  else s.reports.unshift(r);
  s.reports = s.reports.slice(0, 120);
}

/* records a roll call vote, changes the indicators, returns the log entry */
function applyDecision(s, d, t) {
  const changes = [];
  Object.entries(d.effects || {}).forEach(([name, amount]) => {
    if (!(name in s.v)) return;
    const before = s.v[name];
    const after = clamp(before + Number(amount));
    s.v[name] = after;
    changes.push([name, before, after]);
  });

  s.cnt.roll += 1;
  s.stats.dec += 1;
  if (d.result === "Passed") s.stats.pass += 1;
  else s.stats.rej += 1;
  const entry = {
    t,
    date: s.sess.date,
    time: hm(t),
    title: d.title,
    ref: d.ref || "",
    summary: d.summary || "",
    result: d.result,
    yes: d.yes ?? null,
    no: d.no ?? null,
    abs: d.abs ?? null,
    vote: voteText(d.yes, d.no, d.abs),
    pr: d.pr || "",
    changes,
    pid: d.pid || "",
    veto: !!d.veto,
    bill: d.bill || null,
    rollNo: s.cnt.roll,
    sess: s.sess.no,
    sid: s.sess.sid,
  };
  s.log.unshift(entry);
  return entry;
}

function placeBill(s, bill) {
  while (s.ag.concat(s.deferred).some((b) => b.no === bill.no) || s.log.some((l) => l.ref === bill.no)) {
    s.cnt.act += 1;
    bill.no = "FLC-ACT-2026-" + pad(s.cnt.act);
  }
  s.cnt.act = Math.max(s.cnt.act, bill.actNo || 0);
  bill.ins = s.sess.date;
  return bill;
}

function postpone(s, b, auto) {
  s.deferred.push({ ...b, from: s.sess.no });
  s.defLog.push({ sid: s.sess.sid, id: b.id, no: b.no, t: b.t, auto });
  s.defLog = s.defLog.slice(-600);
}

/* an operation returns false when it no longer applies */
/* a party chair / vice must always be a member of that party */
function cleanRoles(s) {
  s.parties.forEach((p) => {
    if (p.chair && !s.members.some((m) => m.id === p.chair && m.party === p.id)) p.chair = "";
    if (p.vice && !s.members.some((m) => m.id === p.vice && m.party === p.id)) p.vice = "";
    if (p.vice && p.vice === p.chair) p.vice = "";
  });
}

const OPS = {
  sess(s, { field, value }) {
    s.sess[field] = value;
  },
  sched(s, { days }) {
    s.sched = { days };
  },
  indicator(s, { name, value }) {
    if (name in s.v) s.v[name] = clamp(value);
  },
  setIndicators(s, { values }) {
    Object.entries(values || {}).forEach(([name, value]) => {
      if (name in s.v) s.v[name] = clamp(value);
    });
  },
  resetStats(s) {
    s.stats = { laws: 0, dec: 0, pass: 0, rej: 0, sess: 0 };
  },
  meta(s, { kind, id, fields }) {
    const o = kind === "b" ? s.ag.find((x) => x.id === id) : s.log.find((x) => x.t === id);
    if (!o) return false;
    Object.assign(o, fields);
  },
  addBill(s, { bill }) {
    if (s.sess.type !== "session" || s.ag.some((b) => b.id === bill.id)) return false;
    s.ag.push(placeBill(s, bill));
    s.stats.laws += 1;
    return bill;
  },
  swapBill(s, { id, bill }) {
    const i = s.ag.findIndex((x) => x.id === id);
    if (i < 0) return false;
    s.ag.splice(i, 1);
    s.ag.splice(i, 0, placeBill(s, bill));
    s.stats.laws += 1;
    return bill;
  },
  vote(s, { pid, t, approved, yes, no, abs, veto }) {
    const i = s.ag.findIndex((x) => x.id === pid);
    if (i < 0 || s.sess.type !== "session") return false;
    const b = s.ag[i];
    s.ag.splice(i, 1);
    if (b.lk) s.dec.push(b.lk);
    return applyDecision(s, {
      title: b.t,
      ref: b.no,
      summary: b.s,
      result: approved ? "Passed" : "Rejected",
      yes, no, abs,
      pr: approved ? b.st : veto ? VETO_NOTE + b.sn : b.sn,
      effects: approved ? b.y : b.n,
      pid,
      veto: !!veto && !approved,
      bill: { ...b, vd: "" },
    }, t);
  },
  defer(s, { id }) {
    const i = s.ag.findIndex((x) => x.id === id);
    if (i < 0) return false;
    const [b] = s.ag.splice(i, 1);
    postpone(s, b, false);
    return b;
  },
  resolution(s, { d, t, sid }) {
    if (s.sess.type !== "session" || s.sess.sid !== sid) return false;
    let ref = d.ref;
    if (!ref) {
      s.cnt.act += 1;
      ref = "FLC-ACT-2026-" + pad(s.cnt.act);
    }
    const entry = applyDecision(s, { ...d, ref }, t);
    const sm = d.sp ? s.members.find((x) => x.id === d.sp) : null;
    if (sm) {
      sm.prop = (sm.prop || 0) + 1;
      entry.sp = sm.id;
      entry.spn = sm.name;
    }
    return entry;
  },
  newDay(s, { fromSid, sid, date, type, bills }) {
    if (s.sess.sid !== fromSid) return false;
    syncReport(s);
    s.base = { ...s.v };
    let no = s.sess.no;
    if (type === "session") {
      const m = /(\d+)$/.exec(no);
      no = m ? no.replace(/\d+$/, String(+m[1] + 1)) : no + "-2";
    }
    s.sess = { no, date, type, sid };
    if (type === "session") {
      s.stats.sess += 1;
      /* keep unvoted items intact in s.ag (never auto-defer); merge manually deferred items */
      const moved = s.deferred.splice(0);
      moved.forEach((b) => {
        if (!s.ag.some((x) => x.id === b.id)) s.ag.push(b);
      });
      const cap = Math.max(0, AGENDA_SIZE - s.ag.length);
      const toAdd = (Array.isArray(bills) ? bills : []).slice(0, cap);
      toAdd.forEach((b) => s.ag.push(placeBill(s, b)));
      s.stats.laws += toAdd.length;
    }
    return true;
  },
  undo(s, { t }) {
    const l = s.log[0];
    if (!l || l.t !== t) return false;
    s.log.shift();
    l.changes.forEach(([n, o]) => { s.v[n] = o; });
    if (l.bill) {
      s.dec = s.dec.filter((k) => k !== l.bill.lk);
      if (s.sess.type === "session") {
        if (!s.ag.some((b) => b.id === l.bill.id)) s.ag.unshift(l.bill);
      } else {
        s.deferred.unshift({ ...l.bill, from: l.sess });
      }
    }
    if (l.sid !== s.sess.sid) {
      const r = s.reports.find((x) => x.sid === l.sid);
      if (r) {
        r.passed = r.passed.filter((x) => x.t !== t);
        r.rejected = r.rejected.filter((x) => x.t !== t);
        r.amended = true;
      }
    }
    /* undoing a mistaken vote reverses its own count; deleting a record never does */
    s.stats.dec = Math.max(0, s.stats.dec - 1);
    if (l.result === "Passed") s.stats.pass = Math.max(0, s.stats.pass - 1);
    else s.stats.rej = Math.max(0, s.stats.rej - 1);
    if (l.sp) {
      const sm = s.members.find((x) => x.id === l.sp);
      if (sm) sm.prop = Math.max(0, (sm.prop || 0) - 1);
    }
    if (l.rollNo === s.cnt.roll) s.cnt.roll -= 1;
    return true;
  },
  stage(s, { id, stage }) {
    const b = s.ag.find((x) => x.id === id);
    if (!b) return false;
    b.stage = stage;
  },
  billDel(s, { id }) {
    const n = s.ag.length + s.deferred.length;
    s.ag = s.ag.filter((x) => x.id !== id);
    s.deferred = s.deferred.filter((x) => x.id !== id);
    if (s.ag.length + s.deferred.length === n) return false;
  },
  logDel(s, { t }) {
    const n = s.log.length;
    s.log = s.log.filter((x) => x.t !== t);
    if (s.log.length === n) return false;
    s.reports.forEach((r) => {
      r.passed = r.passed.filter((x) => x.t !== t);
      r.rejected = r.rejected.filter((x) => x.t !== t);
    });
  },
  reportDel(s, { sid }) {
    const n = s.reports.length;
    s.reports = s.reports.filter((r) => r.sid !== sid);
    if (s.reports.length === n) return false;
  },
  partySave(s, { p }) {
    const rec = {
      id: p.id,
      name: p.name,
      abbr: p.abbr || "",
      color: p.color,
      logo: p.logo || "",
      chair: p.chair || "",
      vice: p.vice || "",
    };
    const i = s.parties.findIndex((x) => x.id === p.id);
    if (i >= 0) s.parties[i] = rec;
    else s.parties.push(rec);
    [rec.chair, rec.vice].forEach((mid) => {
      const m = s.members.find((x) => x.id === mid);
      if (m) m.party = rec.id;
    });
    cleanRoles(s);
  },
  partyMembers(s, { id, ids }) {
    if (!s.parties.some((x) => x.id === id)) return false;
    s.members.forEach((m) => {
      if (ids.includes(m.id)) m.party = id;
      else if (m.party === id) m.party = "";
    });
    cleanRoles(s);
  },
  partyDel(s, { id }) {
    s.parties = s.parties.filter((x) => x.id !== id);
    s.members.forEach((m) => { if (m.party === id) m.party = ""; });
    cleanRoles(s);
  },
  memberSave(s, { m }) {
    const i = s.members.findIndex((x) => x.id === m.id);
    if (i >= 0) Object.assign(s.members[i], { name: m.name, party: m.party, pos: m.pos, img: m.img });
    else s.members.push({ id: m.id, name: m.name, party: m.party, pos: m.pos, img: m.img, warns: [], prop: 0, adj: { p: 0, e: 0, u: 0 } });
    cleanRoles(s);
  },
  memberDel(s, { id }) {
    s.members = s.members.filter((x) => x.id !== id);
    Object.keys(s.att).forEach((sid) => { delete s.att[sid][id]; });
    cleanRoles(s);
  },
  memberStats(s, { id, prop, ap, ae, au }) {
    const m = s.members.find((x) => x.id === id);
    if (!m) return false;
    m.prop = prop;
    m.adj = { p: ap, e: ae, u: au };
  },
  partyRoles(s, { id, chair, vice }) {
    const p = s.parties.find((x) => x.id === id);
    if (!p) return false;
    p.chair = chair;
    p.vice = vice;
  },
  warn(s, { id, k, dir, t }) {
    const m = s.members.find((x) => x.id === id);
    if (!m) return false;
    if (dir > 0) m.warns.push({ t, k });
    else if (m.warns.length) m.warns.pop();
    else return false;
  },
  att(s, { sid, id, st }) {
    if (s.sess.sid !== sid) return false;
    const a = (s.att[sid] = s.att[sid] || {});
    if (st) a[id] = st;
    else delete a[id];
  },
  attAll(s, { sid, ids, st }) {
    if (s.sess.sid !== sid) return false;
    const a = (s.att[sid] = s.att[sid] || {});
    ids.forEach((id) => { if (st) a[id] = st; else delete a[id]; });
  },
  qpct(s, { value }) {
    s.qpct = value;
  },
  sessStart(s, { sid, t, present, total }) {
    if (s.sess.sid !== sid || s.sess.type !== "session") return false;
    s.asm = { sid, started: true, t, present, total };
  },
  sessEnd(s, { sid, t }) {
    if (s.asm.sid !== sid) return false;
    s.asm.started = false;
    s.asm.end = t;
  },
  replace(s, { state }) {
    const next = fixState(clone(state));
    Object.keys(s).forEach((k) => delete s[k]);
    Object.assign(s, next);
  },
};

function applyOp(s, op) {
  if (typeof OPS[op.k] !== "function") return false;
  const result = OPS[op.k](s, clone(op.a));
  if (result !== false) syncReport(s);
  return result;
}

function commit(k, a) {
  const op = { k, a: clone(a) };
  const result = applyOp(S, op);
  if (result === false) {
    toast("تعذر تنفيذ الإجراء: تغيرت بيانات الجلسة");
    return false;
  }
  save();
  syncPush(op);
  return result;
}

function cleanGeminiModel(raw) {
  const cleaned = String(raw || "")
    .trim()
    .replace(/^models\//i, "")
    .replace(/\s+/g, "");
  if (!cleaned) return GEM_DEFAULT;
  const allowed = GEM_MODELS.map((m) => m.id);
  const found = allowed.find((m) => m.toLowerCase() === cleaned.toLowerCase());
  if (found) return found;
  if (/^gemini-(1(\.[05])?|2(\.[05])?)-pro/i.test(cleaned) || /^gemini-pro$/i.test(cleaned)) {
    return "gemini-3.5-pro";
  }
  if (/^gemini-(1(\.[05])?|2(\.[05])?)-flash-lite/i.test(cleaned)) {
    return "gemini-3.5-flash-lite";
  }
  if (/^gemini-(1(\.[05])?|2(\.[05])?)-/i.test(cleaned)) {
    return GEM_DEFAULT;
  }
  if (/^gemini-(3(\.[0-9]+)?|4)-[a-z0-9._-]+$/i.test(cleaned)) return cleaned;
  return GEM_DEFAULT;
}

function cleanThinkingLevel(raw, model) {
  const upper = String(raw || "").trim().toUpperCase();
  if (!GEM_THINKING_LEVELS.includes(upper)) return "";
  if (upper === "MINIMAL" && /-pro\b/i.test(String(model || ""))) return "LOW";
  return upper;
}

      geminiModel: cleanGeminiModel(legacy.model),

      ts: legacy.ts || 0,
    });
  }
  return defaultAI();
}

function repairTruncatedJSON(raw) {
  let s = String(raw || "")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/,\s*([}\]])/g, "$1")
    .trim();

  // Attempt progressive trim to last complete object inside an array (e.g. {"bills":[{...},{...} )
  const billsKeyIdx = s.indexOf('"bills"');
  if (billsKeyIdx !== -1) {
    const arrStart = s.indexOf("[", billsKeyIdx);
    if (arrStart !== -1) {
      let depth = 0;
      let inStr = false;
      let escChar = false;
      let lastCompleteItemEnd = -1;
      for (let i = arrStart + 1; i < s.length; i++) {
        const ch = s[i];
        if (escChar) { escChar = false; continue; }
        if (ch === "\\") { escChar = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === "{") depth++;
        else if (ch === "}") {
          depth--;
          if (depth === 0) lastCompleteItemEnd = i;
        }
      }
      if (lastCompleteItemEnd > arrStart) {
        const candidate = s.slice(0, lastCompleteItemEnd + 1) + "]}";
        try { return JSON.parse(candidate); } catch (e) { /* fall through */ }
      }
    }
  }

  // General bracket balancer for truncated JSON
  let inStr = false;
  let escChar = false;
  const stack = [];
  let lastSafeIdx = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (escChar) { escChar = false; continue; }
    if (ch === "\\") { escChar = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === "{" || ch === "[") stack.push(ch);
    else if (ch === "}" || ch === "]") {
      stack.pop();
      lastSafeIdx = i;
    }
  }
  if (inStr) {
    const lastQuote = s.lastIndexOf('"');
    if (lastQuote > 0) s = s.slice(0, lastQuote);
  }
  s = s.replace(/,\s*$/, "").replace(/:\s*$/, ': ""');
  if (lastSafeIdx > 0 && stack.length > 0) {
    // Recompute stack on trimmed prefix up to lastSafeIdx
    const trimmed = s.slice(0, lastSafeIdx + 1);
    const st2 = [];
    let ins2 = false, esc2 = false;
    for (let i = 0; i < trimmed.length; i++) {
      const ch = trimmed[i];
      if (esc2) { esc2 = false; continue; }
      if (ch === "\\") { esc2 = true; continue; }
      if (ch === '"') { ins2 = !ins2; continue; }
      if (ins2) continue;
      if (ch === "{" || ch === "[") st2.push(ch);
      else if (ch === "}" || ch === "]") st2.pop();
    }
    let closed = trimmed.replace(/,\s*$/, "");
    while (st2.length) {
      const open = st2.pop();
      closed += open === "{" ? "}" : "]";
    }
    try { return JSON.parse(closed); } catch (e) { /* fall through */ }
  }
  while (stack.length) {
    const open = stack.pop();
    s += open === "{" ? "}" : "]";
  }
  return JSON.parse(s);
}

function extractJSON(rawText) {
  const cleaned = String(rawText || "").trim()
    .replace(/^```(?:json)?\s*/i, "")
    .replace(/\s*```$/i, "")
    .trim();
  if (!cleaned) throw new Error("أعاد الخادم رداً فارغاً");
  try { return JSON.parse(cleaned); } catch (e) { /* continue */ }

  const firstObj = cleaned.indexOf("{");
  const firstArr = cleaned.indexOf("[");
  let start = -1;
  let end = -1;
  if (firstObj >= 0 && (firstArr < 0 || firstObj < firstArr)) {
    start = firstObj;
    end = cleaned.lastIndexOf("}");
  } else if (firstArr >= 0) {
    start = firstArr;
    end = cleaned.lastIndexOf("]");
  }
  const slice = start >= 0 ? (end > start ? cleaned.slice(start, end + 1) : cleaned.slice(start)) : cleaned;
  try { return JSON.parse(slice); } catch (e) { /* continue */ }

  try {
    const basicRepaired = slice
      .replace(/[\u201C\u201D]/g, '"')
      .replace(/,\s*([}\]])/g, "$1");
    return JSON.parse(basicRepaired);
  } catch (e) { /* continue to smart repair */ }

  return repairTruncatedJSON(slice);
}

   - السلبيات (تكاليف/خسارة): المؤشرات التي تتضرر أو تفقد فرصة تحسّن بسبب الرفض ولماذا، مع إبراز الآثار غير المباشرة (مثل: استمرار حالة الجمود، تراكم تكلفة المؤجَّل، أو تراجع الثقة والتوقعات في قطاعات مرتبطة).

async function callDirectGemini(apiKey, model, prompt, thinkingLevelOverride) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const cleanModel = cleanGeminiModel(model);
    const thinkingLevel = cleanThinkingLevel(thinkingLevelOverride !== undefined ? thinkingLevelOverride : AI.geminiThinkingLevel, cleanModel);
    const generationConfig = {
      responseMimeType: "application/json",
    };
    if (thinkingLevel) {
      generationConfig.thinkingConfig = {
        thinkingLevel,
      };
    }
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cleanModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const payload = {
      systemInstruction: {
        parts: [{ text: aiSystemText() }],
      },
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }],
        },
      ],
      generationConfig,
    };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    const rawRespText = await res.text().catch(() => "");
    let body = {};
    try { body = rawRespText ? JSON.parse(rawRespText) : {}; } catch (e) { body = {}; }

    if (!res.ok) {
      const rawMsg = (body.error && (body.error.message || body.error.status)) || rawRespText.slice(0, 220) || res.statusText;
      const err = new Error(formatAIError("gemini", res.status, typeof rawMsg === "string" ? rawMsg : JSON.stringify(rawMsg), false));
      err.status = res.status;
      err.retryable = [408, 429, 500, 502, 503, 504].includes(res.status);
      throw err;
    }

    const parts = body?.candidates?.[0]?.content?.parts || [];
    const rawText = parts
      .filter((p) => !p?.thought && typeof p?.text === "string")
      .map((p) => p.text)
      .join("")
      .trim();
    if (!rawText) {
      const err = new Error("Google Gemini: أعاد الخادم استجابة فارغة.");
      err.retryable = true;
      throw err;
    }
    try {
      return { data: extractJSON(rawText), model: cleanModel + " (مباشر)" };
    } catch (parseErr) {
      const err = new Error("Google Gemini: صيغة JSON غير مكتملة — " + (parseErr?.message || ""));
      err.retryable = true;
      throw err;
    }
  } catch (e) {
    if (e && typeof e.retryable === "boolean") throw e;
    const isTimeout = e && e.name === "AbortError";
    const err = new Error(formatAIError("gemini", 0, e && e.message, isTimeout));
    err.retryable = true;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

async function callServerGemini(model, prompt, customKeyOverride, thinkingLevelOverride) {
  const cleanModel = cleanGeminiModel(model);
  const thinkingLevel = cleanThinkingLevel(thinkingLevelOverride !== undefined ? thinkingLevelOverride : AI.geminiThinkingLevel, cleanModel);
  const directKey = String(customKeyOverride !== undefined ? customKeyOverride : (AI.geminiKey || "")).trim();
  if (directKey) {
    return await callDirectGemini(directKey, cleanModel, prompt, thinkingLevel);
  }

  if (location.protocol === "file:" || /\.github\.io$/i.test(location.hostname) || /\.netlify\.app$/i.test(location.hostname)) {
    const err = new Error("Google Gemini: لم يتم إدخال مفتاح Gemini API Key في الإعدادات (لا يوجد خادم خلفي في الاستضافة الثابتة).");
    err.retryable = false;
    throw err;
  }

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const reqBody = {
      model: cleanModel,
      systemInstruction: aiSystemText(),
      prompt,
      expectJson: true,
    };
    if (thinkingLevel) {
      reqBody.thinking_level = thinkingLevel;
    }
    const res = await fetch("/api/ai/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reqBody),
      signal: ctl.signal,
    });
    const rawRespText = await res.text().catch(() => "");
    let body = {};
    try { body = rawRespText ? JSON.parse(rawRespText) : {}; } catch (e) { body = {}; }

    if (!res.ok) {
      if (body && body.code === "MISSING_API_KEY") {
        SERVER_GEMINI = { checked: true, configured: false };
      }
      const serverDetail = body.error || body.rawError || body.message || rawRespText.slice(0, 180) || res.statusText;
      const formatted = String(serverDetail).startsWith("[HTTP")
        ? String(serverDetail)
        : formatAIError("gemini", res.status, String(serverDetail), false);
      const err = new Error(formatted);
      err.status = res.status;
      err.retryable = false;
      throw err;
    }
    if (!body || typeof body.text !== "string") {
      const err = new Error("[HTTP " + res.status + "] أعاد مسار /api/ai/gemini استجابة غير صالحة.");
      err.status = res.status;
      err.retryable = false;
      throw err;
    }
    SERVER_GEMINI = { checked: true, configured: true };
    const usedModel = body.model || cleanModel;
    try {
      return { data: extractJSON(body.text), model: usedModel };
    } catch (parseErr) {
      const err = new Error("Google Gemini: صيغة JSON غير مكتملة — " + (parseErr?.message || ""));
      err.retryable = true;
      throw err;
    }
  } catch (e) {
    if (e && typeof e.retryable === "boolean") throw e;
    const isTimeout = e && e.name === "AbortError";
    const err = new Error(formatAIError("gemini", 0, e && e.message, isTimeout));
    err.retryable = false;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

async function callOpenAICompatible(tier, key, model, endpoint, prompt) {

      headers,
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    const rawRespText = await res.text().catch(() => "");
    let body = {};
    try { body = rawRespText ? JSON.parse(rawRespText) : {}; } catch (e) { body = {}; }

    if (!res.ok) {
      const rawMsg = (body.error && (body.error.message || body.error)) || body.message || rawRespText.slice(0, 220) || res.statusText;
      const err = new Error(formatAIError(tier, res.status, typeof rawMsg === "string" ? rawMsg : JSON.stringify(rawMsg), false));
      err.status = res.status;
      err.retryable = [408, 429, 500, 502, 503, 504].includes(res.status);
      throw err;
    }
    const content = body.choices?.[0]?.message?.content;
    const rawText = Array.isArray(content)
      ? content.map((p) => (typeof p === "string" ? p : p?.text || "")).join("").trim()
      : String(content || "").trim();

    try {
      return { data: extractJSON(rawText), model: body.model || model };
    } catch (parseErr) {
      const err = new Error(providerDisplayName(tier) + ": صيغة JSON غير مكتملة — " + (parseErr?.message || ""));
      err.retryable = true;
      throw err;
    }
  } catch (e) {
    if (e && typeof e.retryable === "boolean") throw e;
    const isTimeout = e && e.name === "AbortError";
    const err = new Error(formatAIError(tier, 0, e && e.message, isTimeout));
    err.retryable = true;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

async function runSlotWithRetry(slot, prompt) {
  let lastErr = null;
  const maxAttempts = slot.tier === "gemini" ? 1 : 2;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    try {
      if (slot.tier === "gemini") {
        return await callServerGemini(slot.model, prompt);
      }
      return await callOpenAICompatible(slot.tier, slot.key, slot.model, slot.endpoint, prompt);
    } catch (e) {
      lastErr = e;
      if (!e.retryable) throw e;
      if (attempt === 0) await sleep(500);
    }
  }
  throw lastErr || new Error("تعذر الاتصال بمزود الذكاء الاصطناعي");
}

async function aiJSON(prompt) {
  const slots = buildFallbackSlots();
  const errors = [];
  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    try {
      const res = await runSlotWithRetry(slot, prompt);
      aiLastError = "";
      const usedLabel = providerDisplayName(slot.tier) + " (" + res.model + ")";
      if (slot.tier !== "gemini") {
        aiLastUsed = usedLabel;
        aiLastUsedNote = "تحويل تلقائي بعد فشل السابق: " + errors.join(" ← ");
        aiStatus = "تم التحويل تلقائياً إلى " + slot.rankLabel + ": " + usedLabel;
        toast("تم التحويل التلقائي — المزود المستخدم: " + usedLabel);
      } else {
        aiLastUsed = usedLabel;
        aiLastUsedNote = "المزود الأساسي";
        aiStatus = "متصل عبر: " + usedLabel;
        toast("المزود المستخدم: " + usedLabel);
      }
      return res.data;
    } catch (e) {
      errors.push(e.message);
      if (i === slots.length - 1) {
        const msg = errors.join(" | ");
        aiLastError = msg;
        aiStatus = msg;
        throw new Error(msg);
      }
    }
  }
}
